name: scanner_bridge
description: A pluggable cross-platform barcode scanner SDK with Zebra DataWedge support and camera fallback.
version: 0.1.0
repository: https://github.com/suatkeskin/scanner_bridge
issue_tracker: https://github.com/suatkeskin/scanner_bridge/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

flutter:
  plugin:
    platforms:
      android:
        package: com.scannerbridge.scanner_bridge
        pluginClass: ScannerBridgePlugin

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

topics:
  - barcode
  - scanner
  - zebra
  - data-capture
