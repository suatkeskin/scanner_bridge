name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Check package formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze package
        run: flutter analyze

      - name: Test package
        run: flutter test

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Check example formatting
        working-directory: example
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Build Android example
        working-directory: example
        run: flutter build apk --debug

      - name: Test Android DataWedge command builder
        working-directory: example/android
        run: ./gradlew :scanner_bridge:testDebugUnitTest --no-daemon

      - name: Build Android example release
        working-directory: example
        run: flutter build apk --release
