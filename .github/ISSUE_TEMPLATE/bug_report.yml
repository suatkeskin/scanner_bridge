name: Bug report
description: Report a reproducible problem with scanner_bridge
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove credentials and personal data before submitting logs.

  - type: input
    id: package-version
    attributes:
      label: scanner_bridge version
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: Pixel 8 / Android 15
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest reproducible example possible.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and error details
      description: Redact tokens, keys, identifiers and personal data.
      render: text
